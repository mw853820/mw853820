<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    /* Custom Hamburger / X toggler */
    .navbar-toggler {
      border: none;
      background: transparent;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1051;
      outline: none !important;
      box-shadow: none !important;
      cursor: pointer;
    }

    /* Hamburger lines (default visible) */
    .navbar-toggler .hamburger-line {
      height: 3px;
      width: 24px;
      background-color: #A61B30;
      border-radius: 2px;
      margin: 3px 0;
      transition: opacity 0.2s ease;
    }

    /* Red X (hidden by default) */
    .navbar-toggler .toggler-x {
      display: none;
      font-size: 2rem;
      font-weight: bold;
      color: #A61B30;
      line-height: 1;
    }

    .nav-link.fs-3 {
      color: #A61B30;
    }

    /* When offcanvas is open, we add .is-open to the button */
    .navbar-toggler.is-open .hamburger-line { display: none; }
    .navbar-toggler.is-open .toggler-x { display: block; }

    /* Offcanvas menu */
    .offcanvas-fullscreen .offcanvas-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .btn-close.text-reset { color: #A61B30; justify-self: right; }

    /* Accordion styling */
    .accordion-toggle { cursor: pointer; }
    .accordion-toggle:hover { background-color: #f8f9fa; }

    /* Expand icon styling */
    .expand-button { text-align: right; width: 40px; }
    .expand-button .bi {
      font-size: 1.2rem;
      color: #000; /* black chevron */
      transition: transform 0.3s ease;
    }
    /* Rotate chevron on expand */
    .accordion-toggle[aria-expanded="true"] .bi { transform: rotate(180deg); }

    /* Status background colors (collapsed rows) */
    .status-resolved { background-color: #D1E7E0; }
    .status-progress { background-color: #F3EED9; }
    .status-not-taken { background-color: #E19896; }

    /* Expanded row border colors */
    .accordion-body {
      border: 8px solid transparent;
      margin: 0;
      padding: 1rem;
    }
    tr > td[colspan] { padding: 0 !important; }

    .status-resolved + tr .accordion-body { border-color: #D1E7E0; }
    .status-progress + tr .accordion-body { border-color: #F3EED9; }
    .status-not-taken + tr .accordion-body { border-color: #E19896; }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="navbar navbar-light bg-white position-relative">
    <div class="container-fluid">
      <a class="navbar-brand text-dark fw-bold" href="#">LOGO</a>
      <!-- Toggler -->
      <button class="navbar-toggler ms-auto" type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasNav"
              aria-controls="offcanvasNav">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="toggler-x">&times;</span>
      </button>
    </div>
  </nav>

  <!-- Offcanvas menu fullscreen -->
  <div class="offcanvas offcanvas-end offcanvas-fullscreen" tabindex="-1" id="offcanvasNav">
    <div class="offcanvas-header"></div>
    <div class="offcanvas-body">
      <ul class="navbar-nav text-center">
        <li class="nav-item"><a class="nav-link fs-3" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link fs-3" href="form.html">Form</a></li>
        <li class="nav-item"><a class="nav-link fs-3" href="timeline.html">Timeline</a></li>
        <li class="nav-item"><a class="nav-link fs-3" href="tracker.html">Tracker</a></li>
      </ul>
    </div>
  </div>

  <!-- Tracker -->
  <div class="container my-5">
    <h2>Recommendations Tracker</h2>
    <div id="trackerMessage" class="alert alert-info d-none" role="alert"></div>
    <div class="table-responsive">
      <table class="table" id="accordionData">
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Recommendation</th>
            <th scope="col">Status</th>
            <th scope="col" class="text-end">Expand</th>
          </tr>
        </thead>
        <tbody>
          <!-- Filled dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="text-center p-4 mt-5" style="background-color: #A61B30;">
    <a href="#" class="text-white mx-2"><i class="bi bi-facebook"></i></a>
    <a href="#" class="text-white mx-2"><i class="bi bi-twitter"></i></a>
    <a href="#" class="text-white mx-2"><i class="bi bi-instagram"></i></a>
    <a href="#" class="text-white mx-2"><i class="bi bi-linkedin"></i></a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="assets/js/data-loader.js"></script>
  <script src="assets/js/tracker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
