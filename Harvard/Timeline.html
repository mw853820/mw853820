<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Column Vertical Timeline with Line + Dots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    .timeline-row.active .timeline-preview {
  display: none !important;
    }

    /* Timeline column, line, and dots */
    .timeline-col {
      position: relative;
    }

    /* Overlapping timeline line for continuity */
    .timeline-line {
      position: absolute;
      top: -20px;     /* extend into previous row */
      bottom: -20px;  /* extend into next row */
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: #A61B30;
      z-index: 1;
    }

    .timeline-dot {
      position: relative;
      z-index: 2;
      width: 16px;
      height: 16px;
      background: #A61B30;
      border-radius: 50%;
      margin: 1rem auto;
    }

    /* Preview / Card toggle */
    .timeline-preview { display: block; }

    /* Collapsed (default) */
    .timeline-card {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s ease, opacity 0.4s ease, max-height 0.4s ease;
    }

    /* Expanded */
    .timeline-row.active .timeline-card {
      max-height: 1000px;   /* big enough for any content */
      height: auto;         /* let content size naturally */
      opacity: 1;
      transform: scaleY(1);
    }

    /* Animate spacing below expanded card */
    .timeline-row {
      margin-bottom: 0;
      transition: margin-bottom 0.4s ease;
    }
    .timeline-row.active {
      margin-bottom: 2rem;
    }

    /* Cursor for interactivity */
    .timeline-event { cursor: pointer; }

    /* Custom Hamburger / X toggler */
    .navbar-toggler {
      border: none;
      background: transparent;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1051;
      outline: none !important;
      box-shadow: none !important;
      cursor: pointer;
    }

    /* Hamburger lines (default visible) */
    .navbar-toggler .hamburger-line {
      height: 3px;
      width: 24px;
      background-color: #A61B30;
      border-radius: 2px;
      margin: 3px 0;
      transition: opacity 0.2s ease;
    }

    /* Red X (hidden by default) */
    .navbar-toggler .toggler-x {
      display: none;
      font-size: 2rem;
      font-weight: bold;
      color: #A61B30;
      line-height: 1;
    }

    .nav-link.fs-3 {
      color: #A61B30;
    }

    /* When offcanvas is open, we add .is-open to the button */
    .navbar-toggler.is-open .hamburger-line { display: none; }
    .navbar-toggler.is-open .toggler-x { display: block; }

    /* Offcanvas menu */
    .offcanvas-fullscreen .offcanvas-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .btn-close.text-reset { color: #A61B30; justify-self: right; }
    .list-group-item { border:none; }

    /* Responsive timeline card */
    .timeline-card {
      width: 100%;
      max-width: 565px;
      border: 4px solid #A61B30 !important;
      border-radius: 0 !important;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .timeline-card .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 1.5rem;
    }

    /* Scrollable text with fade */
    .timeline-card .card-text-area {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding-right: 0.5rem;
      position: relative;
    }
    .timeline-card .card-text-area::after {
      content: "";
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5rem;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff);
      pointer-events: none;
    }

    /* Custom scrollbar */
    .timeline-card .card-text-area::-webkit-scrollbar { width: 8px; }
    .timeline-card .card-text-area::-webkit-scrollbar-thumb {
      background-color: #A61B30;
      border-radius: 4px;
    }
    .timeline-card .card-text-area::-webkit-scrollbar-track { background: #f1f1f1; }

    /* Responsive image wrapper with fixed ratio (485:204) */
    .timeline-card .image-wrapper {
      width: 100%;
      aspect-ratio: 485 / 204;
      max-width: 485px;
      margin: 0 auto;
      flex-shrink: 0;
      background: #fff;
      overflow: hidden;
    }
    .timeline-card .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0;
      display: block;
    }
  </style>
</head>
<body class="p-4">
  <!-- NAV -->
  <nav class="navbar navbar-light bg-white position-relative">
    <div class="container-fluid">
      <a class="navbar-brand text-dark fw-bold" href="#">LOGO</a>
      <!-- Toggler -->
      <button class="navbar-toggler ms-auto" type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasNav"
              aria-controls="offcanvasNav">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="toggler-x">&times;</span>
      </button>
    </div>
  </nav>

  <!-- Offcanvas menu fullscreen -->
  <div class="offcanvas offcanvas-end offcanvas-fullscreen" tabindex="-1" id="offcanvasNav">
    <div class="offcanvas-header"></div>
    <div class="offcanvas-body">
      <ul class="navbar-nav text-center">
        <li class="nav-item"><a class="nav-link fs-3" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link fs-3" href="form.html">Form</a></li>
        <li class="nav-item"><a class="nav-link fs-3" href="Timeline.html">Timeline</a></li>
        <li class="nav-item"><a class="nav-link fs-3" href="Tracker.html">Tracker</a></li>
      </ul>
    </div>
  </div>

<div class="container my-4">
  <div class="row">
    <div class="col-10 offset-2"> 
      <h2 class="fw-bold">Understanding Jewish Life at Harvard: A Resource Hub</h2>
      <p>
        This site provides comprehensive documentation of events, developments, 
        and institutional responses related to Jewish campus life and antisemitism 
        at Harvard University from 2022 to present.
      </p>
    </div>
  </div>
</div>

<div class="p-2">
  <ul id="timelineHighlights" class="list-group list-group-horizontal position-relative overflow-auto w-75 p-4">
    <!-- Populated dynamically -->
  </ul>
</div>

<div class="container mb-4">
  <div class="row">
    <!-- Timeline on the left -->
    <div class="col-lg-9 col-md-8">
      <div id="timeline">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Filters on the right -->
    <div class="col-lg-3 col-md-4">
      <div class="d-flex flex-column align-items-end gap-3">
        <select class="form-select w-auto" id="filterYear">
          <option value="">All Years</option>
        </select>
        <select class="form-select w-auto" id="filterMonth">
          <option value="">All Months</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="text-center p-4 mt-5" style="background-color: #A61B30;">
  <a href="#" class="text-white mx-2"><i class="bi bi-facebook"></i></a>
  <a href="#" class="text-white mx-2"><i class="bi bi-twitter"></i></a>
  <a href="#" class="text-white mx-2"><i class="bi bi-instagram"></i></a>
  <a href="#" class="text-white mx-2"><i class="bi bi-linkedin"></i></a>
</footer>

<script src="harvard-data-store.js"></script>
<script>
  const filters = { year: '', month: '', type: '' };
  const monthNames = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];

  document.addEventListener('DOMContentLoaded', async () => {
    if (!window.HarvardDataStore) {
      console.error('HarvardDataStore is not available.');
      return;
    }

    await window.HarvardDataStore.ensureTimelineSeeded();
    const events = window.HarvardDataStore.getTimelineEvents();
    populateFilters(events);
    renderTimeline(events);
    setupFilterHandlers();
    initOffcanvasToggler();
  });

  function renderTimeline(events) {
    const timelineContainer = document.getElementById('timeline');
    if (!timelineContainer) {
      return;
    }

    timelineContainer.innerHTML = '';

    if (!events.length) {
      const emptyMessage = document.createElement('p');
      emptyMessage.className = 'text-muted';
      emptyMessage.textContent = 'No events have been added yet.';
      timelineContainer.appendChild(emptyMessage);
      updateHighlights([]);
      return;
    }

    const fragment = document.createDocumentFragment();
    events.forEach((event, index) => {
      fragment.appendChild(createTimelineRow(event, index));
    });

    timelineContainer.appendChild(fragment);
    updateHighlights(events);
    attachTimelineEventListeners();
    applyFilters();
  }

  function createTimelineRow(event, index) {
    const row = document.createElement('div');
    row.className = 'row timeline-row';
    row.dataset.year = event.year || '';
    row.dataset.month = event.month || '';
    row.dataset.type = event.type || '';

    const yearCol = document.createElement('div');
    yearCol.className = 'col-2 fw-bold';
    yearCol.textContent = event.year || '';
    row.appendChild(yearCol);

    const dateCol = document.createElement('div');
    dateCol.className = 'col-2 text-center';
    const monthLabel = document.createElement('div');
    monthLabel.textContent = formatMonthName(event.month);
    const dayLabel = document.createElement('div');
    dayLabel.className = 'fw-bold fs-5';
    dayLabel.textContent = formatDay(event.day);
    dateCol.append(monthLabel, dayLabel);
    row.appendChild(dateCol);

    const timelineCol = document.createElement('div');
    timelineCol.className = 'col-1 timeline-col';
    const line = document.createElement('div');
    line.className = 'timeline-line';
    const dot = document.createElement('div');
    dot.className = 'timeline-dot';
    timelineCol.append(line, dot);
    row.appendChild(timelineCol);

    const eventCol = document.createElement('div');
    eventCol.className = 'col-7 timeline-event';

    const preview = document.createElement('div');
    preview.className = 'timeline-preview';
    const previewTitle = document.createElement('h2');
    previewTitle.className = 'h5 mb-1';
    previewTitle.textContent = event.title || event.eventName || 'Untitled Event';
    const previewSummary = document.createElement('p');
    previewSummary.className = 'mb-0';
    previewSummary.textContent = createPreviewText(event.summary);
    preview.append(previewTitle, previewSummary);

    const card = document.createElement('div');
    card.className = 'card timeline-card';
    const cardBody = document.createElement('div');
    cardBody.className = 'card-body';

    const textArea = document.createElement('div');
    textArea.className = 'card-text-area';
    const cardTitle = document.createElement('h2');
    cardTitle.className = 'h5';
    cardTitle.textContent = event.title || event.eventName || 'Untitled Event';
    textArea.appendChild(cardTitle);

    if (event.summary) {
      const summaryParagraph = document.createElement('p');
      summaryParagraph.textContent = event.summary;
      textArea.appendChild(summaryParagraph);
    }

    const safeLink = sanitizeUrl(event.link);
    if (safeLink) {
      const linkParagraph = document.createElement('p');
      const link = document.createElement('a');
      link.href = safeLink;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Read more';
      linkParagraph.appendChild(link);
      textArea.appendChild(linkParagraph);
    }

    cardBody.appendChild(textArea);

    if (event.imageUrl) {
      const imageWrapper = document.createElement('div');
      imageWrapper.className = 'image-wrapper';
      const image = document.createElement('img');
      image.src = event.imageUrl;
      image.alt = event.title || event.eventName || 'Timeline event image';
      imageWrapper.appendChild(image);
      cardBody.appendChild(imageWrapper);
    }

    if (event.createdAt) {
      const submitted = document.createElement('small');
      submitted.className = 'text-muted d-block mt-2';
      submitted.textContent = `Submitted: ${formatDateTime(event.createdAt)}`;
      cardBody.appendChild(submitted);
    }

    card.appendChild(cardBody);
    eventCol.append(preview, card);
    row.appendChild(eventCol);

    return row;
  }

  function createPreviewText(summary = '') {
    const text = summary.trim();
    if (!text) {
      return 'Tap to view details.';
    }
    return text.length > 120 ? `${text.slice(0, 117)}…` : text;
  }

  function formatMonthName(month) {
    const monthIndex = Number.parseInt(month, 10);
    if (!Number.isFinite(monthIndex) || monthIndex < 1 || monthIndex > 12) {
      return '';
    }
    return monthNames[monthIndex - 1];
  }

  function formatDay(day) {
    const numericDay = Number.parseInt(day, 10);
    if (!Number.isFinite(numericDay) || numericDay < 1) {
      return '';
    }
    return String(numericDay).padStart(2, '0');
  }

  function sanitizeUrl(url) {
    const trimmed = (url || '').trim();
    if (!trimmed) {
      return '';
    }

    try {
      const parsed = new URL(trimmed, window.location.origin);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        return parsed.href;
      }
    } catch (error) {
      return '';
    }

    return '';
  }

  function formatDateTime(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
      return '';
    }
    return date.toLocaleString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function attachTimelineEventListeners() {
    document.querySelectorAll('.timeline-event').forEach(eventCol => {
      eventCol.addEventListener('click', () => {
        const row = eventCol.closest('.timeline-row');
        document.querySelectorAll('.timeline-row.active').forEach(openRow => {
          if (openRow !== row) {
            openRow.classList.remove('active');
          }
        });
        row.classList.toggle('active');
      });
    });
  }

  function updateHighlights(events) {
    const list = document.getElementById('timelineHighlights');
    if (!list) {
      return;
    }

    list.innerHTML = '';

    if (!events.length) {
      const emptyItem = document.createElement('li');
      emptyItem.className = 'list-group-item text-muted';
      emptyItem.textContent = 'No events to highlight yet.';
      list.appendChild(emptyItem);
      return;
    }

    events.slice(0, 5).forEach(event => {
      const item = document.createElement('li');
      item.className = 'list-group-item';
      item.textContent = event.title || event.eventName || 'Untitled Event';
      list.appendChild(item);
    });
  }

  function populateFilters(events) {
    const yearSelect = document.getElementById('filterYear');
    const monthSelect = document.getElementById('filterMonth');

    if (yearSelect) {
      const currentValue = yearSelect.value || filters.year;
      yearSelect.innerHTML = '<option value="">All Years</option>';
      const years = Array.from(new Set(events.map(event => event.year).filter(Boolean)))
        .sort((a, b) => Number.parseInt(b, 10) - Number.parseInt(a, 10));

      years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
      });

      if (currentValue && years.includes(currentValue)) {
        yearSelect.value = currentValue;
        filters.year = currentValue;
      }
    }

    if (monthSelect) {
      const currentValue = monthSelect.value || filters.month;
      monthSelect.innerHTML = '<option value="">All Months</option>';
      const months = Array.from(new Set(events.map(event => event.month).filter(Boolean)))
        .sort((a, b) => Number.parseInt(a, 10) - Number.parseInt(b, 10));

      months.forEach(month => {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = formatMonthName(month);
        monthSelect.appendChild(option);
      });

      if (currentValue && months.includes(currentValue)) {
        monthSelect.value = currentValue;
        filters.month = currentValue;
      }
    }
  }

  function setupFilterHandlers() {
    const yearSelect = document.getElementById('filterYear');
    const monthSelect = document.getElementById('filterMonth');

    if (yearSelect) {
      yearSelect.addEventListener('change', event => {
        filters.year = event.target.value;
        applyFilters();
      });
    }

    if (monthSelect) {
      monthSelect.addEventListener('change', event => {
        filters.month = event.target.value;
        applyFilters();
      });
    }
  }

  function applyFilters() {
    document.querySelectorAll('#timeline .timeline-row').forEach(row => {
      const match =
        (!filters.year || row.dataset.year === filters.year) &&
        (!filters.month || row.dataset.month === filters.month) &&
        (!filters.type || row.dataset.type === filters.type);
      row.style.display = match ? '' : 'none';
    });
  }

  function initOffcanvasToggler() {
    const offcanvas = document.getElementById('offcanvasNav');
    const toggler = document.querySelector('[data-bs-toggle="offcanvas"][data-bs-target="#offcanvasNav"]');

    if (offcanvas && toggler) {
      offcanvas.addEventListener('show.bs.offcanvas', () => toggler.classList.add('is-open'));
      offcanvas.addEventListener('hide.bs.offcanvas', () => toggler.classList.remove('is-open'));
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
