<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Column Vertical Timeline with Line + Dots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    .timeline-row.active .timeline-preview {
  display: none !important;
    }

    /* Timeline column, line, and dots */
    .timeline-col {
      position: relative;
    }

    /* Overlapping timeline line for continuity */
    .timeline-line {
      position: absolute;
      top: -20px;     /* extend into previous row */
      bottom: -20px;  /* extend into next row */
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: #A61B30;
      z-index: 1;
    }

    .timeline-dot {
      position: relative;
      z-index: 2;
      width: 16px;
      height: 16px;
      background: #A61B30;
      border-radius: 50%;
      margin: 1rem auto;
    }

    /* Preview / Card toggle */
    .timeline-preview { display: block; }

    /* Collapsed (default) */
    .timeline-card {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s ease, opacity 0.4s ease, max-height 0.4s ease;
    }

    /* Expanded */
    .timeline-row.active .timeline-card {
      max-height: 1000px;   /* big enough for any content */
      height: auto;         /* let content size naturally */
      opacity: 1;
      transform: scaleY(1);
    }

    /* Animate spacing below expanded card */
    .timeline-row {
      margin-bottom: 0;
      transition: margin-bottom 0.4s ease;
    }
    .timeline-row.active {
      margin-bottom: 2rem;
    }

    /* Cursor for interactivity */
    .timeline-event { cursor: pointer; }

    /* Custom Hamburger / X Toggler */
    .navbar-toggler {
      border: none;
      background: white;
      padding: 0;
      width: 30px;
      height: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 1051;
      outline: none !important;
      box-shadow: none !important;
    }

    .hamburger-line {
      height: 3px;
      width: 100%;
      background-color: #A61B30;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .navbar-toggler[aria-expanded="false"] .hamburger-line:nth-child(1) { transform: rotate(0) translateY(0); opacity: 1; }
    .navbar-toggler[aria-expanded="false"] .hamburger-line:nth-child(2) { opacity: 1; }
    .navbar-toggler[aria-expanded="false"] .hamburger-line:nth-child(3) { transform: rotate(0) translateY(0); opacity: 1; }

    .navbar-toggler[aria-expanded="true"] .hamburger-line:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .navbar-toggler[aria-expanded="true"] .hamburger-line:nth-child(2) { opacity: 0; }
    .navbar-toggler[aria-expanded="true"] .hamburger-line:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    /* Offcanvas fullscreen vertically centered links */
    .offcanvas-fullscreen .offcanvas-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .btn-close.text-reset { color: #A61B30; justify-self: right; }
    .list-group-item { border:none; }

    /* Responsive timeline card */
    .timeline-card {
      width: 100%;
      max-width: 565px;
      border: 4px solid #A61B30 !important;
      border-radius: 0 !important;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .timeline-card .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 1.5rem;
    }

    /* Scrollable text with fade */
    .timeline-card .card-text-area {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding-right: 0.5rem;
      position: relative;
    }
    .timeline-card .card-text-area::after {
      content: "";
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5rem;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff);
      pointer-events: none;
    }

    /* Custom scrollbar */
    .timeline-card .card-text-area::-webkit-scrollbar { width: 8px; }
    .timeline-card .card-text-area::-webkit-scrollbar-thumb {
      background-color: #A61B30;
      border-radius: 4px;
    }
    .timeline-card .card-text-area::-webkit-scrollbar-track { background: #f1f1f1; }

    /* Responsive image wrapper with fixed ratio (485:204) */
    .timeline-card .image-wrapper {
      width: 100%;
      aspect-ratio: 485 / 204;
      max-width: 485px;
      margin: 0 auto;
      flex-shrink: 0;
      background: #fff;
      overflow: hidden;
    }
    .timeline-card .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0;
      display: block;
    }
  </style>
</head>
